{% extends "base.html" %}
{% load static %}
{% block content %}
  <div class="breadcrumb-bar">
    <nav class="breadcrumbs breadcrumbs--responsive">
      {% block breadcrumbs %}{% endblock %}
      <span class="save-status hidden"
            data-save-status
            aria-live="polite"
            aria-atomic="true"></span>
    </nav>
    {% block breadcrumb_actions %}{% endblock %}
  </div>
  <!-- TWO COLUMN LAYOUT: Main Content + Sidebar -->
  <div class="two-column {% block two_column_modifier %}{% endblock %}">
    <!-- SIDEBAR: shown at every width. Stacks above the main column on
         narrow screens, sits alongside it from 1024px. -->
    <aside class="two-column__sidebar">
      <div class="card card--padded sidebar--sticky">
        {% block sidebar %}{% endblock %}
      </div>
    </aside>
    <!-- MAIN COLUMN -->
    <div class="two-column__main">
      {% block main %}{% endblock %}
    </div>
  </div>
{% endblock %}
